<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src blob: data:; connect-src https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; worker-src blob: https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">
<title>Cipher</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--line:#2c2c2e;--txt:#f5f5f7;--dim:#8e8e93;--mut:#636366;--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Inter,Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 56px)}

.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 18px}
.hdr h1{font-size:32px;font-weight:700;letter-spacing:-.5px}

.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;background:transparent;border:none;color:var(--dim);font-size:15px;font-weight:600;padding:10px 8px;border-radius:9px;transition:background .15s,color .15s}
.seg button.on{background:#3a3a3c;color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.45)}

.card{background:var(--card);border-radius:16px;padding:14px 16px 12px;transition:box-shadow .15s}
.card.in:focus-within{box-shadow:0 0 0 1.5px rgba(10,132,255,.55)}
textarea{display:block;width:100%;min-height:150px;background:transparent;border:none;color:var(--txt);font:inherit;font-size:17px;line-height:1.5;resize:none;outline:none;overflow-y:hidden}
#code{min-height:96px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:15px;word-break:break-all}
textarea::placeholder{color:var(--mut)}
.foot{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.st{flex:1;min-width:0;font-size:12.5px;color:var(--dim)}
.acts{display:flex;gap:8px;flex:none}
.pill{background:var(--card2);border:none;color:var(--blue);font-size:14px;font-weight:600;padding:8px 15px;border-radius:999px;transition:filter .15s}
.pill:hover{filter:brightness(1.15)}
.pill.ghost{color:var(--dim)}

.go{display:block;width:100%;margin-top:12px;background:var(--blue);border:none;color:#fff;font-size:17px;font-weight:600;padding:15px 18px;border-radius:14px;transition:opacity .15s,transform .1s}
.go:active:not(:disabled){transform:scale(.985)}
.go:disabled{opacity:.35;cursor:default}
.err{font-size:14px;color:var(--orange);margin:10px 4px 0}
.err:empty{display:none}

.result{margin-top:14px;animation:rise .22s ease-out}
.rh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.rh span{font-size:15px;font-weight:600}
.code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14.5px;line-height:1.55;color:#e5e5ea;word-break:break-all;-webkit-user-select:all;user-select:all;max-height:50vh;overflow:auto}
.plain{font-size:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.lock{max-width:520px;margin:12px auto 0;background:var(--card);border-radius:20px;padding:26px 24px 22px}
.lock h2{font-size:22px;font-weight:700;margin-bottom:4px}
.lbl{display:block;font-size:12.5px;color:var(--dim);font-weight:500;margin:14px 0 6px}
.lock input[type=text]{width:100%;background:var(--card2);border:none;border-radius:10px;padding:12px 14px;color:var(--txt);font:inherit;font-size:17px;letter-spacing:.12em;text-transform:uppercase;outline:none}
.lock input[type=text]:focus{box-shadow:0 0 0 2px var(--blue)}
.tog{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:13.5px;color:var(--dim);cursor:pointer;width:max-content;max-width:100%}
.lock .go{margin-top:18px}
.tog input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:#3a3a3c;position:relative;cursor:pointer;transition:background .2s;flex:none}
.tog input:checked{background:var(--green)}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .2s}
.tog input:checked::after{left:20px}
.check{font-size:12.5px;margin-top:8px;color:var(--dim)}
.check:empty{display:none}
.check.ok{color:var(--green)}
.check.bad{color:var(--orange)}

.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translateX(-50%) translateY(20px);background:#2c2c2e;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:all .2s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.result{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <div class="lock" id="lockCard">
    <h2>Cipher</h2>
    <label class="lbl" for="wNum">Number word</label>
    <input type="text" id="wNum" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next">
    <div class="check" id="numCheck"></div>
    <label class="lbl" for="wKey">Key word</label>
    <input type="text" id="wKey" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <label class="tog"><input type="checkbox" id="remember"> Remember on this device</label>
    <button class="go" id="unlock" disabled>Unlock</button>
  </div>

  <div id="main" hidden>
    <div class="hdr">
      <h1>Cipher</h1>
      <button class="pill ghost" id="lockBtn">Lock</button>
    </div>

    <div class="seg" role="tablist">
      <button id="tabMake" class="on" role="tab" aria-selected="true" aria-controls="paneMake">Make code</button>
      <button id="tabRead" role="tab" aria-selected="false" aria-controls="paneRead">Read code</button>
    </div>

    <section id="paneMake" role="tabpanel" aria-labelledby="tabMake">
      <div class="card in">
        <textarea id="msg" placeholder="Type your message" aria-label="Message"></textarea>
        <div class="foot">
          <span class="st" id="msgStatus"></span>
          <span class="acts"><button class="pill ghost" id="fileBtn">Add file</button><button class="pill ghost" id="msgClear">Clear</button></span>
        </div>
      </div>
      <button class="go" id="makeBtn" disabled>Make code</button>
      <div class="err" id="makeErr" role="alert"></div>
      <div class="card result" id="codeBox" hidden>
        <div class="rh"><span>Your code</span><button class="pill" id="codeCopy">Copy</button></div>
        <div class="code" id="codeOut"></div>
      </div>
      <input type="file" id="file" accept="image/*,.txt,.pdf,text/plain,application/pdf" multiple hidden>
    </section>

    <section id="paneRead" role="tabpanel" aria-labelledby="tabRead" hidden>
      <div class="card in">
        <textarea id="code" placeholder="Paste the code" aria-label="Code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" enterkeyhint="go"></textarea>
        <div class="foot">
          <span class="st"></span>
          <span class="acts"><button class="pill" id="pasteBtn">Paste</button><button class="pill ghost" id="codeClear">Clear</button></span>
        </div>
      </div>
      <button class="go" id="readBtn" disabled>Read code</button>
      <div class="err" id="readErr" role="alert"></div>
      <div class="card result" id="msgBox" hidden>
        <div class="rh"><span>Message</span><button class="pill" id="msgCopy">Copy</button></div>
        <div class="plain" id="msgOut"></div>
      </div>
    </section>
  </div>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ═══ older codes still open ═══ */
function unb64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),out=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function openOldLock(body){
  var all;try{all=unb64(body)}catch(e){throw new Error('broken')}
  if(all.length<29)throw new Error('broken');
  var base=await crypto.subtle.importKey('raw',enc8.encode(W.num+'|'+W.key),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:all.slice(0,16),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']),pt;
  try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},key,all.slice(28))}catch(e){throw new Error('words')}
  return dec8.decode(pt);
}
var SYMS='$,.%-/:@()#&+=?!';
function symLetters(num){var out='';for(var i=65;i<=90;i++){var c=String.fromCharCode(i);if(num.indexOf(c)<0)out+=c}return out}
function openOldWords(text){
  var num=W.num,key=W.key,sl=symLetters(num),out='',ki=0,chars=Array.from(String(text||''));
  for(var i=0;i<chars.length;i++){
    var c=chars[i],cd=c.charCodeAt(0);
    if(cd>=65&&cd<=90){var d=num.indexOf(c);if(d>-1){out+=String((d+1)%10);continue}var si=sl.indexOf(c);if(si>-1&&si<SYMS.length){out+=SYMS[si];continue}out+=c;continue}
    if(cd>=97&&cd<=122){var p=cd-97,s=key.charCodeAt(ki%key.length)-65;out+=String.fromCharCode(97+((p-s)%26+26)%26);ki++;continue}
    out+=c;
  }
  return caps(out);
}
function caps(t){
  t=t.replace(/(^|[.!?]\s+|\n\s*)([a-z])/g,function(m,a,b){return a+b.toUpperCase()});
  return t.replace(/\bi\b/g,'I').replace(/\bi'([md]|ll|ve)\b/g,"I'$1");
}
function newBody(s){var i=s.indexOf(TAG);if(i<0)return null;var m=/^[1-9A-HJ-NP-Za-km-z]+/.exec(s.slice(i+TAG.length));return m?m[0]:''}
async function openAny(raw){
  var t=String(raw||''),flat=t.replace(/[\s​-‍⁠﻿]+/g,''),m;
  if(flat.indexOf(TAG)>-1){
    /* the code as pasted first, then with any line breaks taken out */
    var tries=[newBody(t),newBody(flat)].filter(function(b,k,a){return b&&a.indexOf(b)===k}),worst='broken';
    for(var k=0;k<tries.length;k++){try{return await openNew(tries[k])}catch(e){if(e.message!=='broken')worst=e.message}}
    throw new Error(worst);
  }
  if(flat.slice(0,5)==='LOCK.'){m=/^[A-Za-z0-9_-]+/.exec(flat.slice(5));if(!m)throw new Error('broken');return openOldLock(m[0])}
  if(/[0-9]/.test(flat))throw new Error(/^[1-9A-HJ-NP-Za-km-z]{60,}$/.test(flat)?'broken':'notcode');
  return openOldWords(t.trim());
}
function errText(e){
  var c=e&&e.message;
  if(c==='broken')return 'That code is cut off or changed';
  if(c==='words')return 'Wrong words for this code';
  if(c==='browser')return "This browser can't run the lock";
  if(c==='notcode')return "That's not a code";
  return 'Something went wrong, try again';
}

/* ═══ page ═══ */
function fit(el){
  if(!el.offsetParent)return;
  el.style.height='auto';
  var max=Math.max(200,Math.round(window.innerHeight*.55)),h=el.scrollHeight+2;
  el.style.height=Math.min(h,max)+'px';el.style.overflowY=h>max?'auto':'hidden';
}
function reveal(el){requestAnimationFrame(function(){var r=el.getBoundingClientRect();if(r.bottom>window.innerHeight-12||r.top<0)el.scrollIntoView({behavior:'smooth',block:'nearest'})})}
function syncButtons(){
  $('makeBtn').disabled=makeBusy||!W||!$('msg').value.trim();
  $('readBtn').disabled=readBusy||!W||!$('code').value.trim();
}
function onMsgInput(){msgSeq++;$('codeBox').hidden=true;$('codeOut').textContent='';$('makeErr').textContent='';fit($('msg'));syncButtons()}
function onCodeInput(){codeSeq++;$('msgBox').hidden=true;$('msgOut').textContent='';$('readErr').textContent='';fit($('code'));syncButtons()}
function setTab(t){
  var mk=t==='make';
  $('tabMake').classList.toggle('on',mk);$('tabRead').classList.toggle('on',!mk);
  $('tabMake').setAttribute('aria-selected',String(mk));$('tabRead').setAttribute('aria-selected',String(!mk));
  $('paneMake').hidden=!mk;$('paneRead').hidden=mk;
  fit(mk?$('msg'):$('code'));
}

async function doMake(){
  if(makeBusy||!W)return;
  var text=$('msg').value;if(!text.trim())return;
  if(/^\s*(LOCK2[1-9A-HJ-NP-Za-km-z]{40,}|LOCK\.[A-Za-z0-9_-]{30,})\s*$/.test(text)){$('makeErr').textContent="That's already a code, use Read code";return}
  var seq=msgSeq,btn=$('makeBtn');
  makeBusy=true;btn.textContent='Making code…';syncButtons();$('makeErr').textContent='';$('msg').blur();
  try{
    await paint();
    var code=await lockText(text);
    if(seq!==msgSeq||!W)return;
    $('codeOut').textContent=code;$('codeBox').hidden=false;reveal($('codeBox'));
  }catch(e){if(seq===msgSeq&&W)$('makeErr').textContent=errText(e)}
  finally{makeBusy=false;btn.textContent='Make code';syncButtons()}
}
async function doRead(){
  if(readBusy||!W)return;
  var raw=$('code').value;if(!raw.trim())return;
  var seq=codeSeq,btn=$('readBtn');
  readBusy=true;btn.textContent='Reading…';syncButtons();$('readErr').textContent='';$('code').blur();
  try{
    await paint();
    var msg=await openAny(raw);
    if(seq!==codeSeq||!W)return;
    $('msgOut').textContent=msg;$('msgBox').hidden=false;reveal($('msgBox'));
  }catch(e){if(seq===codeSeq&&W)$('readErr').textContent=errText(e)}
  finally{readBusy=false;btn.textContent='Read code';syncButtons()}
}
function copyText(v){
  if(!v)return;
  var done=function(){toast('Copied')};
  var fallback=function(){
    var ta=document.createElement('textarea');ta.value=v;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,v.length);
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);ok?done():toast("Couldn't copy, select it and copy");
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,fallback);else fallback();
}
async function doPaste(){
  var box=$('code');
  try{
    if(!navigator.clipboard||!navigator.clipboard.readText)throw 0;
    var t=await navigator.clipboard.readText();
    if(!t||!t.trim()){toast('Nothing copied yet');return}
    box.value=t.trim();onCodeInput();
  }catch(e){box.focus();toast('Paste it into the box')}
}

/* ═══ lock screen ═══ */
function checkWords(){
  var num=normWord($('wNum').value),key=normWord($('wKey').value),ok=numOk(num),c=$('numCheck');
  c.className='check'+(num?(ok?' ok':' bad'):'');
  c.textContent=!num||ok?'':(num.length!==10?num.length+' letters, needs 10':'Two letters repeat');
  $('unlock').disabled=!(ok&&key.length>0);
}
function unlock(){
  var num=normWord($('wNum').value),key=normWord($('wKey').value);
  if(!numOk(num)||!key)return;
  W={num:num,key:key};
  try{if($('remember').checked)localStorage.setItem(KEY,JSON.stringify(W));else localStorage.removeItem(KEY)}catch(e){}
  $('wNum').value='';$('wKey').value='';
  $('lockCard').hidden=true;$('main').hidden=false;
  lastActive=Date.now();hiddenAt=0;
  setTab('make');syncButtons();$('msg').focus();
}
function lock(){
  W=null;msgSeq++;codeSeq++;
  ['msg','code'].forEach(function(id){$(id).value='';$(id).style.height=''});
  ['codeOut','msgOut','makeErr','readErr','msgStatus'].forEach(function(id){$(id).textContent=''});
  $('codeBox').hidden=true;$('msgBox').hidden=true;
  try{localStorage.removeItem(KEY)}catch(e){}
  $('remember').checked=false;
  $('main').hidden=true;$('lockCard').hidden=false;
  checkWords();syncButtons();$('wNum').focus();
}
function quietLock(){lock();toast('Locked, it was quiet for a while')}
function touch(){lastActive=Date.now()}
setInterval(function(){
  if(!W)return;var now=Date.now();
  if((document.hidden&&hiddenAt&&now-hiddenAt>AWAY)||now-lastActive>IDLE)quietLock();
},15000);
document.addEventListener('visibilitychange',function(){
  if(!W)return;
  if(document.hidden){hiddenAt=Date.now();return}
  var now=Date.now(),away=hiddenAt?now-hiddenAt:0;hiddenAt=0;
  if(away>AWAY||now-lastActive>IDLE){quietLock();return}
  touch();
});
['pointerdown','keydown','input'].forEach(function(ev){document.addEventListener(ev,function(){if(W)touch()},true)});

/* ═══ wiring ═══ */
$('wNum').addEventListener('input',checkWords);$('wKey').addEventListener('input',checkWords);
$('unlock').addEventListener('click',unlock);
$('wNum').addEventListener('keydown',function(e){if(e.key!=='Enter')return;e.preventDefault();if(!$('unlock').disabled)unlock();else if(numOk(normWord($('wNum').value)))$('wKey').focus()});
$('wKey').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();if(!$('unlock').disabled)unlock()}});
$('lockBtn').addEventListener('click',lock);
$('tabMake').addEventListener('click',function(){setTab('make');if(!$('msg').value)$('msg').focus()});
$('tabRead').addEventListener('click',function(){setTab('read')});
$('msg').addEventListener('input',function(){$('msgStatus').textContent='';onMsgInput()});
$('code').addEventListener('input',onCodeInput);
$('msg').addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();doMake()}});
$('code').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();doRead()}});
$('makeBtn').addEventListener('click',doMake);
$('readBtn').addEventListener('click',doRead);
$('codeCopy').addEventListener('click',function(){copyText($('codeOut').textContent)});
$('msgCopy').addEventListener('click',function(){copyText($('msgOut').textContent)});
$('pasteBtn').addEventListener('click',doPaste);
$('msgClear').addEventListener('click',function(){$('msg').value='';$('msgStatus').textContent='';onMsgInput();$('msg').focus()});
$('codeClear').addEventListener('click',function(){$('code').value='';onCodeInput()});
window.addEventListener('resize',function(){if(!W)return;fit($('msg'));fit($('code'))});

/* ═══ files into the message box ═══ */
function within(ms,p){return Promise.race([p,new Promise(function(res,rej){setTimeout(function(){rej(new Error('slow'))},ms)})])}
function loadScript(src,sri){return new Promise(function(res,rej){var s=document.createElement('script');s.integrity=sri;s.crossOrigin='anonymous';s.referrerPolicy='no-referrer';s.onload=res;s.onerror=rej;s.src=src;document.head.appendChild(s)})}
async function ensureOcr(){if(window.Tesseract)return;await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js','sha384-GJqSu7vueQ9qN0E9yLPb3Wtpd7OrgK8KmYzC8T1IysG1bcvxvIO4qtYR/D3A991F')}
async function ensurePdf(){if(window.pdfjsLib)return;await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'}
async function imageText(blob){
  await ensureOcr();
  var src=blob;
  try{var bm=await createImageBitmap(blob);if(bm.width<1800){var k=Math.min(3,2400/Math.max(1,bm.width)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);var cx=cv.getContext('2d');cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';cx.drawImage(bm,0,0,cv.width,cv.height);src=cv}}catch(e){}
  var r=await Tesseract.recognize(src,'eng');
  return String(r.data.text||'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function pdfText(blob){
  await ensurePdf();
  var pdf=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise,out=[];
  for(var p=1;p<=pdf.numPages;p++){var pg=await pdf.getPage(p),tc=await pg.getTextContent(),line='',lastY=null;tc.items.forEach(function(it){var y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3){out.push(line.trim());line=''}line+=(line&&!/\s$/.test(line)?' ':'')+it.str;lastY=y});out.push(line.trim())}
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function takeBlob(blob,name){
  if(!W)return;
  setTab('make');
  var st=$('msgStatus');
  try{
    var t='';
    if(/^image\//.test(blob.type)){st.textContent='Reading the picture, about 20 seconds';t=await within(120000,imageText(blob))}
    else if(blob.type==='application/pdf'||/\.pdf$/i.test(name||'')){st.textContent='Reading the PDF';t=await within(90000,pdfText(blob))}
    else{t=await blob.text()}
    if(!W)return;
    if(!t){st.textContent='Nothing readable in that one';return}
    var box=$('msg'),cur=box.value;box.value=(cur?cur+'\n\n':'')+t;st.textContent='';onMsgInput();
  }catch(e){if(W)st.textContent='Could not read that file'}
}
function hasFiles(e){var ty=e.dataTransfer&&e.dataTransfer.types;return !!ty&&Array.prototype.indexOf.call(ty,'Files')>-1}
$('fileBtn').addEventListener('click',function(){$('file').click()});
$('file').addEventListener('change',function(e){Array.prototype.slice.call(e.target.files||[]).forEach(function(f){takeBlob(f,f.name)});e.target.value=''});
$('msg').addEventListener('paste',function(e){
  var items=(e.clipboardData&&e.clipboardData.items)||[];
  for(var i=0;i<items.length;i++){if(/^image\//.test(items[i].type)){var b=items[i].getAsFile();if(b){e.preventDefault();takeBlob(b,'paste.png');return}}}
});
document.addEventListener('dragover',function(e){if(hasFiles(e))e.preventDefault()});
document.addEventListener('drop',function(e){if(!hasFiles(e))return;e.preventDefault();if(!W)return;Array.prototype.slice.call(e.dataTransfer.files||[]).forEach(function(f){takeBlob(f,f.name)})});

/* ═══ start ═══ */
try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&numOk(normWord(o.num))&&normWord(o.key)){$('wNum').value=o.num;$('wKey').value=o.key;$('remember').checked=true;unlock();return}}catch(e){}
checkWords();$('wNum').focus();
})();
